<!doctype html>
<!--
  STEAL COMPETITOR SEO - DASHBOARD TEMPLATE

  For Claude: fill ONLY the JSON inside <script id="dashboard-data"> near the bottom.
  Never change the HTML, CSS or the render script. Keep the JSON valid.
  Each prompt fills its own keys. Leave a key as null until its prompt has run,
  and the dashboard shows "Fills in at prompt N" there instead.

  Keys and what fills them:
    you, rivals, date              - prompt 1 (rivals: up to 4, in order)
    pages, keywords, links         - prompt 1 (Semrush)
    gbp, listings                  - prompt 4 (local footprint)
    ai                             - prompt 5 (what AI says)

  Shapes (all numbers are plain numbers, no commas):
    you:      {"name": "Dave's Plumbing", "domain": "davesplumbing.com", "city": "Austin"}
    rivals:   [{"name": "Acme Plumbing", "domain": "acmeplumbing.com"}, ...]
    pages:    [{"rival": "acmeplumbing.com", "url": "https://...", "type": "service" | "blog", "visits": 91, "keywords": 54}, ...]
              service pages 30+ visits a month, blog posts 50+, from Semrush Top Pages
    keywords: [{"keyword": "drain cleaning", "volume": 12100, "intent": ["C"], "positions": {"acmeplumbing.com": 35}, "urls": {"acmeplumbing.com": "https://..."}}, ...]
              only keywords a rival ranks top 20 for and you don't; intent letters C, T, I
    links:    {"checked": 30, "total": 4593, "win": [{"domain": "redflagdeals.com", "url": "https://...", "what": "Forum - threads recommend them",
                "rivals": ["acmeplumbing.com"], "authority": 60, "action": "Answer threads as yourself", "contact": "https://... or mailto:..."}],
               "directories": 5, "unclear": 4, "junk": 19}
    gbp:      {"rivals": [{"domain": "acmeplumbing.com", "rating": 4.4, "reviews": 298, "categories": ["Plumber"]}], "you": ["Plumber"]}
    listings: [{"site": "Angi", "url": "https://...", "tier": "core" | "worth" | "skip", "rivals": ["acmeplumbing.com"],
                "add": "https://... or null", "note": "why there's no form, if none"}]
    ai:       {"question": "Who's the best plumber in Austin?", "chats": 12,
               "named": [{"name": "Blue Water Plumbing", "count": 9}, ...],
               "sources": [{"site": "proscore.ca", "url": "https://...", "type": "Ranking site", "count": 6, "names_rival": false,
                            "action": "Claim profile", "contact": "https://... or mailto:..."}]}
-->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steal competitor SEO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing:border-box; margin:0; padding:0; }
:root { --canvas:#f5f4ed; --ivory:#faf9f5; --sand:#e8e6dc; --ink:#141413; --body:#5e5d59; --muted:#87867f; --hair:#ece9df;
  --terra:#c96442; --coral:#d97757; --good:#3d7a4a; --good-bg:rgba(61,122,74,.09); --warn:#9a7410; --warn-bg:rgba(212,160,23,.12); }
body { background:var(--canvas); color:var(--ink); font:13px/1.4 system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
.n, em, small, .strip .k, summary, .foot, .sub, .meta { font-family:"JetBrains Mono",ui-monospace,Menlo,monospace; }
.wrap { max-width:1000px; margin:0 auto; padding:20px 24px 32px; }
header { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin-bottom:12px; }
header h1 { font:500 26px/1.1 "Tiempos Text",Georgia,serif; letter-spacing:-.4px; }
.meta { color:var(--muted); font-size:12px; }
.strip { display:grid; grid-template-columns:repeat(4,1fr); background:var(--ivory); border:1px solid var(--hair); border-radius:12px; }
.strip > div { padding:10px 14px; border-right:1px solid var(--hair); } .strip > div:last-child { border-right:0; }
.strip .v { font:500 21px/1.1 "Tiempos Text",Georgia,serif; } .strip .v small { font-size:12px; color:var(--muted); }
.strip .k { font-size:9.5px; text-transform:uppercase; letter-spacing:1.1px; color:#6e6d66; margin-top:3px; }
.card { background:var(--ivory); border:1px solid var(--hair); border-radius:12px; padding:12px 16px; margin-top:12px; }
.card h2 { font:500 15px/1.2 "Tiempos Text",Georgia,serif; display:flex; align-items:baseline; gap:8px; margin-bottom:6px; }
.card.wait { border-style:dashed; background:transparent; } .card.wait p { color:var(--muted); font-size:12.5px; }
.n { font-size:10.5px; color:var(--coral); text-transform:uppercase; letter-spacing:1px; }
.r { display:grid; gap:12px; align-items:center; padding:4px 0; border-top:1px solid var(--hair); min-height:26px; }
.r > span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
.r > span.right { text-align:right; }
em { font-style:normal; font-size:10px; color:var(--muted); } small { font-size:10.5px; color:var(--muted); }
a { color:var(--terra); text-decoration:none; font-weight:500; } a:hover { text-decoration:underline; }
a.ext { display:inline-flex; vertical-align:-1px; margin-left:6px; color:var(--muted); padding:2px; border-radius:4px; }
a.ext:hover { color:var(--terra); background:var(--sand); }
i { font-style:normal; color:var(--muted); font-size:11px; }
b { font-weight:500; font-size:10px; text-transform:uppercase; letter-spacing:.6px; padding:1px 6px; border-radius:99px; }
b.core { color:var(--good); background:var(--good-bg); } b.worth { color:#2a5ea8; background:rgba(42,120,214,.09); } b.skip { color:var(--warn); background:var(--warn-bg); }
b.it { padding:1px 5px; margin-right:2px; font-size:9.5px; } .it-C { color:#9a4a2e; background:rgba(201,100,66,.12); } .it-T { color:#2a5ea8; background:rgba(42,120,214,.12); } .it-I { color:#6e6d66; background:var(--sand); }
.bar { display:block; height:8px; background:var(--sand); border-radius:4px; overflow:hidden; } .bar i { display:block; height:100%; border-radius:4px; }
.stack { display:flex; gap:2px; height:12px; border-radius:4px; overflow:hidden; margin:4px 0; } .stack i { display:block; height:100%; }
.legend { display:flex; flex-wrap:wrap; gap:3px 14px; font-size:11.5px; color:var(--body); margin:2px 0 6px; }
.legend b { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:5px; padding:0; vertical-align:-1px; }
.legend.top { margin:8px 2px 0; }
.dot { display:block; width:11px; height:11px; border-radius:50%; margin-left:auto; } .dot.off { border:1.5px dashed var(--muted); }
.chip { display:inline-block; margin:1px 4px 1px 0; padding:1px 7px; border:1px solid var(--hair); border-radius:99px; background:#fff; color:var(--body); }
details summary { cursor:pointer; font-size:10.5px; color:var(--terra); padding:5px 0 1px; list-style:none; }
details summary::before { content:"+ "; } details[open] summary::before { content:"- "; }
.foot { font-size:10.5px; color:var(--muted); margin-top:6px; }
.sub { font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin:8px 0 2px; }
b.flag { color:var(--good); background:var(--good-bg); margin-left:6px; }
@media (max-width:760px) { .strip { grid-template-columns:repeat(2,1fr); } .wrap { padding:16px; }
  .r { grid-template-columns:1fr auto !important; } .r > span:nth-child(n+2):not(:last-child) { display:none; } }
</style></head><body><div class="wrap" id="app"></div>

<script id="dashboard-data" type="application/json">
{
  "date": null,
  "you": null,
  "rivals": null,
  "pages": null,
  "keywords": null,
  "links": null,
  "gbp": null,
  "listings": null,
  "ai": null
}
</script>

<script>
(() => {
  const D = JSON.parse(document.getElementById("dashboard-data").textContent);
  const COLOURS = ["#c96442", "#1baf7a", "#eda100", "#4a3aa7"], YOU = "#2a78d6", OTHER = "#cfcdc4";
  const SHOW = 6;
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const num = n => Number(n || 0).toLocaleString("en-US");
  const rivals = (D.rivals || []).slice(0, 4).map((r, i) => ({ ...r, colour: COLOURS[i] }));
  const byDomain = Object.fromEntries(rivals.map(r => [r.domain, r]));
  const short = d => (d || "").replace(/^www\./, "").split(".")[0];
  const ICON = '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>';
  const ext = (url, label) => url ? `${label}<a class="ext" href="${esc(url)}" target="_blank" rel="noreferrer" title="Open ${esc(url)}">${ICON}</a>` : label;
  const action = (text, link) => {
    if (!link) return `<i>${esc(text)}</i>`;
    if (link.startsWith("mailto:")) return `<a href="${esc(link)}">${esc(text)} · ${esc(link.slice(7))}</a>`;
    return `<a href="${esc(link)}" target="_blank" rel="noreferrer">${esc(text)}</a>`;
  };
  const bar = (v, top, colour, tip) => `<span class="bar" title="${esc(tip || "")}"><i style="width:${!top || !v ? 0 : Math.max(2, 100 * v / top).toFixed(1)}%;background:${colour}"></i></span>`;
  const dot = (colour, on, tip) => `<i class="dot${on ? "" : " off"}" style="${on ? "background:" + colour : ""}" title="${esc(tip || "")}"></i>`;
  const row = (cells, cols, rightFrom = 99) => `<div class="r" style="grid-template-columns:${cols}">` + cells.map((c, i) => `<span class="${i >= rightFrom ? "right" : ""}">${c}</span>`).join("") + "</div>";
  const more = (rows, show = SHOW) => rows.length <= show ? rows.join("") : rows.slice(0, show).join("") + `<details><summary>Show all ${rows.length}</summary>${rows.slice(show).join("")}</details>`;
  const card = (title, count, body, foot) => `<section class="card"><h2>${esc(title)}${count !== "" ? `<span class="n">${esc(count)}</span>` : ""}</h2>${body}${foot ? `<div class="foot">${foot}</div>` : ""}</section>`;
  const wait = (title, prompt) => `<section class="card wait"><h2>${esc(title)}<span class="n">prompt ${prompt}</span></h2><p>Fills in when you run prompt ${prompt}.</p></section>`;
  const rivalHead = (lead, tail) => rivals.map(r => `<em title="${esc(r.name)}">${esc(short(r.domain).slice(0, 2))}</em>`);

  function pages() {
    if (!D.pages) return wait("Their top service + blog pages", 1);
    const items = [...D.pages].sort((a, b) => b.visits - a.visits);
    const top = Math.max(1, ...items.map(p => p.visits));
    const rows = items.map(p => {
      const rv = byDomain[p.rival] || { colour: OTHER, name: p.rival };
      let path = p.url; try { path = new URL(p.url).pathname; } catch (e) {}
      return row([ext(p.url, esc(path)), `<em>${esc(p.type)}</em>`, bar(p.visits, top, rv.colour, `${rv.name}: ${num(p.visits)} visits a month`), num(p.visits), `${num(p.keywords)} kw`], "1fr 60px 160px 50px 56px", 3);
    });
    return card("Their top service + blog pages", items.length, more(rows), "Visits a month, Semrush estimate. Service pages 30+, blog posts 50+. Bar colour = rival.");
  }

  function keywords() {
    if (!D.keywords) return wait("Keywords they rank top 20 for, you don't", 1);
    const items = [...D.keywords].sort((a, b) => b.volume - a.volume);
    const top = Math.max(1, ...items.map(k => k.volume));
    const cols = "1fr 52px 110px 56px " + rivals.map(() => "40px").join(" ") + " 36px";
    const head = row(["", "<em>intent</em>", "", "<em>vol</em>", ...rivalHead(), "<em>you</em>"], cols, 3);
    const rows = items.map(k => {
      const tags = (k.intent || []).map(t => `<b class="it it-${esc(t)}">${esc(t)}</b>`).join("");
      const pos = rivals.map(r => {
        const p = (k.positions || {})[r.domain];
        const u = (k.urls || {})[r.domain];
        return p ? (u ? `<a href="${esc(u)}" target="_blank" rel="noreferrer" style="color:${r.colour}">#${p}</a>` : `<span style="color:${r.colour}">#${p}</span>`) : "<i>-</i>";
      });
      return row([ext("https://www.google.com/search?q=" + encodeURIComponent(k.keyword), esc(k.keyword)), tags, bar(k.volume, top, rivals[0] ? rivals[0].colour : OTHER, `${num(k.volume)} searches a month`), num(k.volume), ...pos, "<i>-</i>"], cols, 3);
    });
    const count = t => items.filter(k => (k.intent || []).includes(t)).length;
    return card("Keywords they rank top 20 for, you don't", items.length, head + more(rows, 10),
      `Searches a month. Click a position to open their ranking page. C commercial ${count("C")} · T transactional ${count("T")} · I informational ${count("I")}`);
  }

  function links() {
    if (!D.links) return wait("Links to win", 1);
    const L = D.links, win = L.win || [];
    const parts = [["Win", win.length, "#c96442"], ["Directories", L.directories || 0, "#2a78d6"], ["Unclear", L.unclear || 0, "#eda100"], ["Junk", L.junk || 0, OTHER]];
    const total = parts.reduce((s, p) => s + p[1], 0) || 1;
    const funnel = `<span class="stack">${parts.filter(p => p[1]).map(p => `<i style="width:${(100 * p[1] / total).toFixed(2)}%;background:${p[2]}" title="${p[0]}: ${p[1]}"></i>`).join("")}</span>`
      + `<div class="legend">${parts.map(p => `<span><b style="background:${p[2]}"></b>${p[0]} ${p[1]}</span>`).join("")}</div>`;
    const cols = "170px 1fr " + rivals.map(() => "16px").join(" ") + " 50px 300px";
    const rows = win.map(w => row([ext(w.url || "https://" + w.domain, esc(w.domain)), esc(w.what),
      ...rivals.map(r => dot(r.colour, (w.rivals || []).includes(r.domain), r.name)), w.authority ? `AS ${w.authority}` : "", action(w.action || "", w.contact)], cols, 2));
    const foot = L.total ? `Top ${num(L.checked)} of about ${num(L.total)} sites linking to the rivals, sorted by authority` : "";
    return card("Links to win", win.length, funnel + rows.join(""), foot);
  }

  function gbp() {
    if (!D.gbp) return wait("Google Business Profile categories", 4);
    const have = rivals.map(r => [r, (D.gbp.rivals || []).find(x => x.domain === r.domain)]).filter(x => x[1]);
    const mine = new Set(D.gbp.you || []);
    const usage = {};
    have.forEach(([, x]) => (x.categories || []).forEach(c => usage[c] = (usage[c] || 0) + 1));
    const cols = "1fr " + have.map(() => "22px").join(" ") + " 22px 60px";
    const head = row(["<em>Category</em>", ...have.map(([r]) => `<em title="${esc(r.name)}">${esc(short(r.domain).slice(0, 2))}</em>`), "<em>you</em>", "<em>used by</em>"], cols, 1);
    const rows = Object.entries(usage).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
      .map(([c, n]) => row([esc(c), ...have.map(([r, x]) => dot(r.colour, x.categories.includes(c), r.name)), dot(YOU, mine.has(c), "you"), `${n} of ${have.length}`], cols, 1));
    const reviews = have.map(([r, x]) => isFinite(parseFloat(x.rating)) ? `${r.name} ${parseFloat(x.rating).toFixed(1)}★ (${num(String(x.reviews ?? "").replace(/,/g, ""))})` : `${r.name}: rating not pulled`).join(" · ");
    return card("Google Business Profile categories", "most used first", head + more(rows), `Reviews: ${esc(reviews)}. Primary category first; add only categories for work you really do.`);
  }

  function listings() {
    if (!D.listings) return wait("Listings to get", 4);
    const rank = { core: 0, worth: 1, skip: 2 };
    const items = [...D.listings].sort((a, b) => (rank[a.tier] ?? 1) - (rank[b.tier] ?? 1) || (b.rivals || []).length - (a.rivals || []).length);
    const cols = "1fr " + rivals.map(() => "16px").join(" ") + " 16px 70px 220px";
    const head = row(["", ...rivalHead(), "<em>you</em>", "", ""], cols, 1);
    const rows = items.map(l => row([ext(l.url, esc(l.site)), ...rivals.map(r => dot(r.colour, (l.rivals || []).includes(r.domain), r.name)), dot(YOU, false, "you"),
      `<b class="${esc(l.tier || "worth")}">${l.tier === "skip" ? "skip" : l.tier === "core" ? "core" : "worth it"}</b>`,
      l.add ? `<a href="${esc(l.add)}" target="_blank" rel="noreferrer">Add</a>` : `<i>${esc(l.note || "no form")}</i>`], cols, 1));
    const keep = items.filter(l => l.tier !== "skip").length;
    return card("Listings to get", `${keep} worth it`, head + more(rows, keep), "Core = the directories Google and the AIs trust. Skip = sites that copy listings automatically or sell classifieds.");
  }

  function ai() {
    if (!D.ai) return wait("What AI says", 5);
    const A = D.ai, chats = A.chats || 1;
    const named = [...(A.named || [])].sort((a, b) => b.count - a.count);
    rivals.forEach(r => { if (!named.some(n => n.name.toLowerCase().includes(r.name.toLowerCase()))) named.unshift({ name: r.name, count: 0 }); });
    const colourOf = name => (rivals.find(r => name.toLowerCase().includes(r.name.toLowerCase())) || {}).colour || OTHER;
    const nameRows = named.slice(0, 10).map(n => row([n.count === 0 ? `<strong>${esc(n.name)}</strong>` : esc(n.name), bar(n.count, chats, colourOf(n.name), `named in ${n.count} of ${chats} chats`), `${n.count}/${chats}`], "260px 1fr 44px", 2));
    const sources = [...(A.sources || [])].sort((a, b) => b.count - a.count);
    const top = Math.max(1, ...sources.map(s => s.count));
    const srcRows = sources.map(s => row([ext(s.url, esc(s.site)) + (s.names_rival ? '<b class="flag">names a rival</b>' : ""), `<em>${esc(s.type)}</em>`,
      bar(s.count, top, "#5e5d59", `cited in ${s.count} of ${chats} chats`), String(s.count), action(s.action || "", s.contact)], "230px 120px 80px 24px 1fr", 3));
    return card("What AI says", `${chats} chats`, '<div class="sub">Who the AIs recommend</div>' + nameRows.join("") + '<div class="sub">What they cite, and what to do</div>' + srcRows.join(""),
      `"${esc(A.question || "")}" · asked in ChatGPT, Claude, Perplexity and Gemini`);
  }

  function strip() {
    const cell = (v, k) => `<div><div class="v">${v}</div><div class="k">${esc(k)}</div></div>`;
    const topNamed = D.ai ? Math.max(0, ...rivals.map(r => ((D.ai.named || []).find(n => n.name.toLowerCase().includes(r.name.toLowerCase())) || { count: 0 }).count)) : null;
    return '<div class="strip">'
      + cell(D.keywords ? num(D.keywords.length) : "-", "Keywords they rank top 20 for")
      + cell(D.links ? (D.links.win || []).length : "-", "Links to win")
      + cell(D.listings ? `${D.listings.filter(l => l.tier !== "skip").length} <small>vs 0</small>` : "-", "Listings worth getting vs yours")
      + cell(D.ai ? `${topNamed}/${D.ai.chats}` : "-", "AI answers naming the top rival")
      + "</div>";
  }

  const you = D.you || { name: "Your business", city: "" };
  const names = rivals.length ? rivals.map(r => r.name).join(" · ") : "Your competitors";
  document.title = "Steal " + names;
  const legend = `<div class="legend top">${rivals.map(r => `<span><b style="background:${r.colour}"></b>${ext("https://" + r.domain, esc(r.name))}</span>`).join("")}<span><b style="background:${YOU}"></b>${esc(you.name)}</span></div>`;
  document.getElementById("app").innerHTML =
    `<header><h1>${esc(names)} <span style="color:var(--muted)">vs</span> ${esc(you.name)}</h1><span class="meta">${esc(you.city || "")}${D.date ? " · " + esc(D.date) : ""}</span></header>`
    + strip() + (rivals.length ? legend : "") + pages() + keywords() + links() + gbp() + listings() + ai();
})();
</script>
</body></html>
